plugins {
    id 'com.android.application'
}

android {
    lint { abortOnError = false }
    namespace 'com.dalton.braillekeyboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.dalton.braillekeyboard"
        minSdk 24
        targetSdk 36
        versionCode 55
        versionName "3.0-2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    packaging {
        jniLibs {
            // Store native libs uncompressed and 16 KB page-aligned so the
            // APK is compatible with 16 KB page-size devices (Android 15+).
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }
}

configurations.configureEach {
    // androidx libraries pull in Kotlin stdlib, but an older transitive
    // dependency brings in kotlin-stdlib-jdk8 1.6.21 which clashes with the
    // kotlin-stdlib 1.8.22 that contains the same classes. Force one version.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation project(':brailleback:service')
    implementation project(':brailleback:client')
}
